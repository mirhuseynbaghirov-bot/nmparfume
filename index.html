        html, body {

        * {
            margin: 0;
            padding: 0;

            scroll-behavior: smooth;
        }

        .gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .ambient-glow-1 {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(50px);
            animation: pulseGlow 6s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: translateX(-50%) scale(0.9); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.1); }
        }

        /* Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
        }

        .nav-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;

        .nav-links a:hover {

        }

        .btn-gold-outline {
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 8px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .btn-gold-outline:hover {
            color: #000;
            background: var(--gold-primary);
            box-shadow: var(--shadow-gold);
        }

        /* Hero */
        .hero {
            position: relative;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 20px 60px;
            background: radial-gradient(ellipse at center, rgba(20, 20, 20, 0.6) 0%, rgba(5, 5, 5, 1) 100%);

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .hero-subtitle {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--gold-primary);
            margin-bottom: 20px;
            display: block;

            margin: 0 auto 30px;
            font-weight: 300;
        }

        /* Category Filter Chips */
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;

            color: #000;
            background: var(--gold-gradient);
            font-weight: 600;

        }

            font-weight: 400;

        .product-grid {

            gap: 25px;

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 22px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

        .product-card:hover {

            border-color: var(--border-gold);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        .product-brand {

            margin-bottom: 6px;

        .product-title {

            letter-spacing: 1px;

                    <div class="product-card" data-gender="${p.gender}">
                        <div>
                            <div class="product-brand">${p.brand}</div>
                            <h3 class="product-title">${p.name}</h3>
                        </div>
                        <div>
                            <div class="product-volume"><i class="fa-solid fa-flask"></i> ${p.vol}</div>
                            <a href="https://wa.me/994707150040?text=${waMessage}" target="_blank" class="btn-order-wa">
                                <i class="fa-brands fa-whatsapp"></i> Sifariş Et
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function filterGender(gender) {
            const chips = document.querySelectorAll('.cat-chip');
            chips.forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(gender);
        }

        // Ilk acilisda butun etirleri yukle
        renderProducts();
    </script>
</body>
