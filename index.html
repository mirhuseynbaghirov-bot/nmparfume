<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ətir Dünyası</title>
    <style>
        /* SAYTIN TAM YUXARIDAN (SIFIRDAN) BAŞLAMASI ÜÇÜN RESET CSS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        header {
            background-color: #1a1a1a;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .search-container {
            position: relative;
            width: 50%;
            max-width: 400px;
        }

        .search-container input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto 30px auto; /* Yuxarı boşluq sıfırlandı */
            padding: 20px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 5px;
            display: inline-block;
        }

        /* MƏHSUL KARTLARI GRID */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 16px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            display: block;
        }

        /* AXTARIŞ NƏTİCƏSİ MESAJI */
        .no-results {
            display: none;
            padding: 20px;
            background: #fff3cd;
            color: #856404;
            border-radius: 5px;
            margin-top: 10px;
        }

        /* KOMMENTLƏR VƏ ƏLAVƏ FUNKSİYALAR SEKSİYASI */
        .comments-section {
            margin-top: 50px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }

        .comment-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }

        .comment-author {
            font-weight: bold;
            font-size: 14px;
        }

        .comment-text {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PARFUM</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Ətir adını yazın..." onkeyup="handleSearch()">
        </div>
    </header>

    <div class="main-container">
        <h2 class="section-title" id="gridTitle">Ən Populyar Ətirlər</h2>
        
        <div id="noResults" class="no-results">
            Axtardığınız ətir tapılmadı. Sifariş üçün <a href="https://wa.me/YOUR_NUMBER" target="_blank">WhatsApp-a yazın</a>.
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Dinamik olaraq JS vasitəsilə doldurulacaq -->
        </div>

        <!-- BƏRPA EDİLƏN KOMMENTARİYA VƏ ƏLAVƏ FUNKSİONALLIQ SEKSİYASI -->
        <div class="comments-section">
            <h2 class="section-title">Müştəri Rəyləri</h2>
            <div id="commentsList">
                <div class="comment-item">
                    <div class="comment-author">Rəşad M.</div>
                    <div class="comment-text">Çox keyfiyyətli ətirlərdir, çatdırılma da sürətli oldu. Təşəkkürlər!</div>
                </div>
                <div class="comment-item">
                    <div class="comment-author">Aysel K.</div>
                    <div class="comment-text">Baccarat Rouge 540 orijinalı ilə tam eynidir, qalıcılığı superdir.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // PDF-DƏKİ BÜTÜN ƏTİRLƏRİN BAZASI
        const perfumeDatabase = [
            // ƏN POPULYAR 3 ƏTİR (Ana səhifədə görünənlər)
            { id: 1, name: "Baccarat Rouge 540", desc: "Şərq, Qənnadı, Zərif şirinlik", price: "120 AZN", isPopular: true },
            { id: 2, name: "Creed Aventus", desc: "Meyvəli, Odunsu, Şipr", price: "150 AZN", isPopular: true },
            { id: 3, name: "Tom Ford Lost Cherry", desc: "Meyvəli, Şərqi, Albalı notları", price: "135 AZN", isPopular: true },
            
            // PDF-DƏN ƏLAVƏ EDİLƏN DİĞƏR ƏTİRLƏR (Ara üzdə görünmür, sadecə axtarışda çıxır)
            { id: 4, name: "Dior Sauvage", desc: "Təravətli, Ədviyyatlı, Odunsu", price: "110 AZN", isPopular: false },
            { id: 5, name: "Chanel Bleue De Chanel", desc: "Aromatik, Odunsu təmizlik", price: "125 AZN", isPopular: false },
            { id: 6, name: "Maison Francis Kurkdjian Grand Soir", desc: "Amber, Şərqi, İsti", price: "140 AZN", isPopular: false },
            { id: 7, name: "Kilian Angels' Share", desc: "Konyak, Darçın, Palıd", price: "160 AZN", isPopular: false },
            { id: 8, name: "Xerjoff Erba Pura", desc: "Meyvəli, Sitrus, Amber", price: "130 AZN", isPopular: false },
            { id: 9, name: "Byredo Bal d'Afrique", desc: "Odunsu, Vetiver, Çiçəksiz", price: "115 AZN", isPopular: false },
            { id: 10, name: "Parfums de Marly Delina", desc: "Çiçəkli, Qızılgül, Liçi", price: "145 AZN", isPopular: false }
        ];

        // SƏHİFƏ YÜKLƏNƏNDƏ YALNIZ POPULYAR 3 ƏTRİ GÖSTƏR
        function renderPopularProducts() {
            const grid = document.getElementById("productsGrid");
            grid.innerHTML = "";
            
            const populars = perfumeDatabase.filter(p => p.isPopular);
            populars.forEach(product => {
                grid.appendChild(createProductCard(product));
            });
        }

        // MƏHSUL KARTI YARATMAQ ÜÇÜN KÖMƏKÇİ FUNKSİYA
        function createProductCard(product) {
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <div>
                    <div class="product-title">${product.name}</div>
                    <div class="product-desc">${product.desc}</div>
                </div>
                <div>
                    <div class="product-price">${product.price}</div>
                    <a href="https://wa.me/YOUR_NUMBER?text=Salam,%20${encodeURIComponent(product.name)}%20haqqında%20məlumat%20almaq%20istəyirəm." class="btn-whatsapp" target="_blank">WhatsApp ilə Sifariş</a>
                </div>
            `;
            return card;
        }

        // AXTARIŞ FUNKSİYASI
        function handleSearch() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const grid = document.getElementById("productsGrid");
            const noResults = document.getElementById("noResults");
            const gridTitle = document.getElementById("gridTitle");

            grid.innerHTML = "";

            if (query === "") {
                // Axtarış boşdursa yenidən yalnız 3 populyarı göstər
                gridTitle.textContent = "Ən Populyar Ətirlər";
                noResults.style.display = "none";
                renderPopularProducts();
                return;
            }

            gridTitle.textContent = "Axtarış Nəticələri";

            // Bütün bazadan (populyar + gizli ətirlər) axtarış et
            const filtered = perfumeDatabase.filter(product => 
                product.name.toLowerCase().includes(query) || 
                product.desc.toLowerCase().includes(query)
            );

            if (filtered.length > 0) {
                noResults.style.display = "none";
                filtered.forEach(product => {
                    grid.appendChild(createProductCard(product));
                });
            } else {
                // Yalnız tamamilə bazada olmayan ətir yazıldıqda WhatsApp mesajı çıxır
                noResults.style.display = "block";
            }
        }

        // İLK YÜKLƏNMƏ
        document.addEventListener("DOMContentLoaded", renderPopularProducts);
    </script>
</body>
</html>
