        :root {

            --bg-card: rgba(18, 18, 18, 0.75);

            --gold-light: #f3e5ab;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --border-gold: rgba(212, 175, 55, 0.25);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-gold: 0 10px 30px -10px rgba(212, 175, 55, 0.3);
        }

        html, body {
            max-width: 100vw;
            overflow-x: hidden !important;
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        h1, h2, h3, h4, .brand-font {
            font-family: 'Playfair Display', serif;
        }

        .gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .ambient-glow {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 700px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
            filter: blur(50px);
        }

        /* Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
        }

        .nav-logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .btn-gold-outline {
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 8px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .btn-gold-outline:hover {
            color: #000;
            background: var(--gold-gradient);
            box-shadow: var(--shadow-gold);
        }

        /* Hero */
        .hero {
            position: relative;
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 20px 40px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-subtitle {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--gold-primary);
            margin-bottom: 15px;
            display: block;
            font-weight: 600;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 25px;
        }

        /* Interactive Search & Filter Section */
        .search-container {
            max-width: 700px;
            margin: 0 auto 30px;
            position: relative;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            padding: 18px 25px 18px 55px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid var(--border-gold);
            border-radius: 50px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .search-box input:focus {
            border-color: var(--gold-primary);
            box-shadow: var(--shadow-gold);
            background: rgba(30, 30, 30, 0.95);
        }

        .search-box i {
            position: absolute;
            left: 22px;
            color: var(--gold-primary);
            font-size: 18px;
        }

        .category-filter {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .cat-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cat-chip.active, .cat-chip:hover {
            border-color: var(--gold-primary);
            color: #000;
            background: var(--gold-gradient);
            font-weight: 600;
        }

        /* Catalog Section */
        .catalog-section {
            padding: 20px 6% 80px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .section-title-wrap {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title-wrap h2 {
            font-size: 32px;
            font-weight: 400;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 22px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-gold);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
        }

        .badge-popular {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--gold-gradient);
            color: #000;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-brand {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold-primary);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .product-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.3;
        }

        .product-volume {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-order-wa {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--gold-light);
            padding: 10px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-order-wa:hover {
            background: var(--gold-gradient);
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 1px;
        }

            .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
            .product-card { padding: 15px; }
            .product-title { font-size: 15px; }

        let currentMode = 'popular'; // 'popular', 'gender', 'search'

        function renderList(list, title) {
            const container = document.getElementById('productContainer');
            document.getElementById('sectionTitle').innerText = title;
            container.innerHTML = '';

            if(list.length === 0) {
                container.innerHTML = `<div class="no-results"><i class="fa-solid fa-circle-exclamation" style="font-size: 30px; margin-bottom: 10px; color: var(--gold-primary);"></i><br>Axtarışınıza uyğun ətir tapılmadı.</div>`;
                return;
            }

            list.forEach(p => {
                const waMessage = encodeURIComponent(`Salam, NM Parfume. Mən bu ətir haqqında məlumat almaq və sifariş etmək istəyirəm:\n\n*Brend:* ${p.brand}\n*Ətir:* ${p.name}\n*Həcm:* ${p.vol}`);
                const popularBadge = p.popular ? `<span class="badge-popular">Populyar</span>` : '';

                container.innerHTML += `
                    <div class="product-card">
                        ${popularBadge}
                        <div>
                            <div class="product-brand">${p.brand}</div>
                            <h3 class="product-title">${p.name}</h3>
                        </div>
                        <div>
                            <div class="product-volume"><i class="fa-solid fa-flask"></i> ${p.vol}</div>
                            <a href="https://wa.me/994707150040?text=${waMessage}" target="_blank" class="btn-order-wa">
                                <i class="fa-brands fa-whatsapp"></i> Sifariş Et
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // Ilk acilisda YALNIZ 3 dene populyar etri goster[span_131](start_span)[span_131](end_span)
        function showPopular() {
            setActiveChip('btn-popular');
            document.getElementById('searchInput').value = '';
            const popularList = perfumes.filter(p => p.popular);
            renderList(popularList, 'Ən Populyar Ətirlər');
        }

        // Gender menyularina basilanda ve ya Butun kolleksiyaya basilanda
        function filterGender(gender) {
            document.getElementById('searchInput').value = '';
            setActiveChip(`btn-${gender}`);

            let title = 'Bütün Kolleksiya';
            if(gender === 'men') title = 'Kişilər Üçün Ətirlər';
            if(gender === 'women') title = 'Qadınlar Üçün Ətirlər';
            if(gender === 'unisex') title = 'Uniseks Ətirlər';

            const filtered = gender === 'all' ? perfumes : perfumes.filter(p => p.gender === gender);
            renderList(filtered, title);
        }

        // Axtaris inputuna soz yazildiqda CANLI AXTARIS
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if(query === '') {
                showPopular();
                return;
            }

            // Butun chipleri passiv et
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));

            const results = perfumes.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.brand.toLowerCase().includes(query)
            );

            renderList(results, `Axtarış Nəticələri (${results.length})`);
        }

        function setActiveChip(id) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            const btn = document.getElementById(id);
            if(btn) btn.classList.add('active');
        }

        // Səhifə açılan kimi yalnız populyarları vurğula
        showPopular();
