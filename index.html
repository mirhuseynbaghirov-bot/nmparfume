            display: inline-block;
        }

            z-index: 1000;

            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;

            border-radius: 40px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            color: var(--gold-primary);
            font-size: 16px;
        }

        /* Category Filter Chips */

            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;

            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 11px;

            transition: all 0.3s ease;

            letter-spacing: 1px;

        .cat-chip.active {

            font-weight: 400;

            border-radius: 14px;

        function renderList(list, title) {
            const container = document.getElementById('productContainer');
            document.getElementById('sectionTitle').innerText = title;
            container.innerHTML = '';

            if(!list || list.length === 0) {
                container.innerHTML = `<div class="no-results"><i class="fa-solid fa-circle-exclamation" style="font-size: 24px; margin-bottom: 8px; color: var(--gold-primary);"></i><br>Ətir tapılmadı.</div>`;
                return;
            }

            list.forEach(p => {
                const waMessage = encodeURIComponent(`Salam, NM Parfume. Mən bu ətir haqqında məlumat almaq və sifariş etmək istəyirəm:\n\n*Brend:* ${p.brand}\n*Ətir:* ${p.name}\n*Həcm:* ${p.vol}`);
                const popularBadge = p.popular ? `<span class="badge-popular">Populyar</span>` : '';

                container.innerHTML += `
                    <div class="product-card">
                        ${popularBadge}
                        <div>
                            <div class="product-brand">${p.brand}</div>
                            <h3 class="product-title">${p.name}</h3>
                        </div>
                        <div>
                            <div class="product-volume"><i class="fa-solid fa-flask"></i> ${p.vol}</div>
                            <a href="https://wa.me/994707150040?text=${waMessage}" target="_blank" class="btn-order-wa">
                                <i class="fa-brands fa-whatsapp"></i> Sifariş Et
                            </a>
                        </div>
                    </div>
                `;
            });
        }

            setActiveChip('btn-popular');
            document.getElementById('searchInput').value = '';
            const popularList = perfumes.filter(p => p.popular);

            if(gender === 'women') title = 'Qadınlar Üçün Ətirlər';
            if(gender === 'unisex') title = 'Uniseks Ətirlər';

            const filtered = gender === 'all' ? perfumes : perfumes.filter(p => p.gender === gender);
            renderList(filtered, title);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if(query === '') {
                showPopular();
                return;
            }

            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));

            const results = perfumes.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.brand.toLowerCase().includes(query)
            );

            renderList(results, `Axtarış Nəticələri (${results.length})`);
        }

        function setActiveChip(id) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            const btn = document.getElementById(id);
            if(btn) btn.classList.add('active');
        }

        window.onload = function() {
            showPopular();
        };
    </script>
</body>
</html>
